<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>আল হিকমাহ পরিবার</title>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7f5;--card:#fff;--tx:#14231c;--mu:#5d6f66;--pr:#0f7b55;--pr2:#e2f3ec;--bd:#d9e3de;--rd:#c0392b;--am:#b7791f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Hind Siliguri",system-ui,sans-serif;font-size:16px;line-height:1.5;padding-bottom:76px}
header{background:var(--pr);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 10px;text-align:center}
header h1{margin:0;font-family:"Tiro Bangla","Hind Siliguri",serif;font-weight:400;font-size:30px;line-height:1.5}
main{padding:12px 14px;max-width:560px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:18px;font-weight:600}
.big{font-size:30px;font-weight:700;color:var(--pr);line-height:1.5}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
.mu{color:var(--mu);font-size:13px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--pr2);color:var(--pr)}
.tag.no{background:#f9e0dc;color:var(--rd)}.tag.wait{background:#f8ecd2;color:var(--am)}
select,input{font:inherit;color:var(--tx);background:#fff;border:1px solid var(--bd);border-radius:10px;padding:9px 10px;width:100%}
button{font:inherit;border:0;border-radius:10px;padding:9px 14px;background:var(--pr);color:#fff;cursor:pointer}
button.g{background:var(--pr2);color:var(--pr)}button.r{background:var(--rd)}
button.w{width:100%;margin-top:14px}
label{display:block;margin:10px 0 4px;font-size:14px;color:var(--mu)}
.num{display:flex;gap:8px;align-items:center;margin:6px 0}.num b{flex:1}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--bd);display:none;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:12px 2px;font-size:13px}
nav button.on{color:var(--pr);font-weight:700}
.sw{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#14231c;color:#fff;padding:9px 16px;border-radius:99px;font-size:14px;display:none;z-index:9}
</style></head>
<body>
<header><h1>আল হিকমাহ পরিবার</h1></header>
<main id="app"></main><nav id="nav"></nav><div class="toast" id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ===== এখানে Firebase থেকে পাওয়া কনফিগ বসান =====
const CFG={apiKey:"AIzaSyBerY0EPENimYaAL6-A67NZ31SManjImp4",authDomain:"alhikmah-family.firebaseapp.com",projectId:"alhikmah-family",storageBucket:"alhikmah-family.firebasestorage.app",messagingSenderId:"1094673205545",appId:"1:1094673205545:web:2d073da68f2a8d08c08f38"};
// ==================================================
firebase.initializeApp(CFG);
const A=firebase.auth(),DB=firebase.firestore(),FV=firebase.firestore.FieldValue;
const MN=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
const N=new Date(),CUR=N.getFullYear()*12+N.getMonth(),TODAY=new Date(N-N.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const RL={admin:'অ্যাডমিন',senior:'কমিটি',general:'সাধারণ সদস্য'};
const $=i=>document.getElementById(i),v=i=>$(i).value;
const d=n=>String(n).replace(/\d/g,c=>'০১২৩৪৫৬৭৮৯'[c]);
const bn=n=>'৳ '+d(Number(n).toLocaleString('en-US'));
const ml=i=>MN[i%12]+' '+d(Math.floor(i/12));
const fd=s=>{const p=s.split('-');return d(+p[2])+' '+MN[p[1]-1]+' '+d(p[0])};
const em=p=>p.replace(/\D/g,'')+'@alhikmah.app';
const mo=n=>Array.from({length:n},(_,k)=>`<option value="${CUR-k}">${ml(CUR-k)}</option>`).join('');
const tag=p=>p?'<span class="tag">জমা হয়েছে</span>':'<span class="tag no">বাকি</span>';
const toast=s=>{const e=$('toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',2200)};
const cp=n=>navigator.clipboard.writeText(n).then(()=>toast('নাম্বার কপি হয়েছে'),()=>toast(n));
let me=null,S={numbers:{},perms:{}},tab=0,viewM=null,booting=false;const RQ={};

const get=async(q)=>(await q.get()).docs.map(x=>({id:x.id,...x.data()}));
const pays=uid=>get(uid?DB.collection('payments').where('uid','==',uid):DB.collection('payments'));
const mems=async()=>(await get(DB.collection('members'))).sort((a,b)=>a.name.localeCompare(b.name));

function st(m,P){const by={};let p=0,first=null;P.forEach(x=>{const b=by[x.month]=by[x.month]||{a:0,d:x.date,v:x.via};b.a+=x.amount;if(x.date<b.d)b.d=x.date;p+=x.amount;if(!first||x.date<first)first=x.date});
let du=0,c=0;const L=[];for(let i=m.js;i<=CUR;i++){const a=by[i]?by[i].a:0;a>=m.fee?c++:du+=m.fee-a;L.push({i,a,e:by[i]})}return{p,du,c,first,L:L.reverse(),n:L.length}}

function hist(m,P){const s=st(m,P);return `<div class="card"><h2>${m.name}</h2><div class="mu">সদস্য হয়েছেন: ${ml(m.js)} · মাসিক ${bn(m.fee)}</div>
<div class="row"><span>প্রথম জমা দিয়েছেন</span><b>${s.first?fd(s.first):'এখনো নেই'}</b></div>
<div class="row"><span>মোট জমা</span><b style="color:var(--pr)">${bn(s.p)}</b></div>
<div class="row"><span>মোট বাকি</span><b style="color:var(--rd)">${bn(s.du)}</b></div>
<div class="row"><span>পরিশোধিত মাস</span><b>${d(s.c)} / ${d(s.n)}</b></div></div>
<div class="card"><h2>মাসভিত্তিক হিসাব</h2>${s.L.map(x=>`<div class="row"><span>${ml(x.i)}<div class="mu">${x.e?fd(x.e.d)+' · '+x.e.v:'জমা হয়নি'}</div></span><span style="text-align:right">${x.a>=m.fee?'<span class="tag">জমা</span>':x.a>0?'<span class="tag wait">আংশিক</span>':'<span class="tag no">বাকি</span>'}<div class="mu">${bn(x.a)} / ${bn(m.fee)}</div></span></div>`).join('')}</div>`}

async function fundCard(){try{const s=(await DB.doc('summary/fund').get()).data();return `<div class="card"><h2>সংগঠনের মোট ফান্ড</h2><div class="big">${bn(s.income-s.expense)}</div><div class="mu">মোট জমা ${bn(s.income)} − মোট খরচ ${bn(s.expense)}</div></div>`}catch(e){return ''}}
async function expCard(){try{const E=(await get(DB.collection('expenses'))).sort((a,b)=>b.date.localeCompare(a.date));return `<div class="card"><h2>খরচের হিসাব</h2>${E.length?E.map(e=>`<div class="row"><span>${e.title}<div class="mu">${fd(e.date)}</div></span><b>${bn(e.amount)}</b></div>`).join(''):'<div class="mu">এখনো কোনো খরচ নেই</div>'}</div>`}catch(e){return ''}}
async function mine(){const P=await pays(me.id),s=st(me,P),w=(await get(DB.collection('requests').where('uid','==',me.id))).some(r=>r.status=='pending'),ok=s.L[0]&&s.L[0].a>=me.fee;
return `<div class="card"><h2>আমার হিসাব (${ml(CUR)})</h2><div class="row"><span>মাসিক জমা</span><b>${bn(me.fee)}</b></div><div class="row"><span>এই মাসের অবস্থা</span>${w?'<span class="tag wait">যাচাই চলছে</span>':tag(ok)}</div><div class="row"><span>মোট জমা</span><b>${bn(s.p)}</b></div><div class="row"><span>মোট বাকি</span><b style="color:var(--rd)">${bn(s.du)}</b></div></div>`}
const myHist=async()=>hist(me,await pays(me.id));

async function list(){const[M,P]=await Promise.all([mems(),pays()]);return `<div class="card"><h2>সকল সদস্য</h2><div class="mu">নামে ট্যাপ করলে বিস্তারিত দেখা যাবে।</div>${M.map(m=>{const s=st(m,P.filter(x=>x.uid==m.id));return `<div class="row" onclick="V('${m.id}')" style="cursor:pointer"><span>${m.name}<div class="mu">${RL[m.role]} · বাকি ${bn(s.du)}</div></span>${tag(s.L[0]&&s.L[0].a>=m.fee)}</div>`}).join('')}</div>`}
async function det(){const m={id:viewM,...(await DB.doc('members/'+viewM).get()).data()};return `<button class="g" style="margin-bottom:10px" onclick="V(null)">← সদস্য তালিকা</button>`+hist(m,await pays(viewM))}
const V=id=>{viewM=id;draw()},T=i=>{tab=i;viewM=null;draw()};

async function send(){const n=S.numbers||{};return `<div class="card"><h2>টাকা পাঠান</h2><div class="mu">নাম্বার কপি করে বিকাশ/নগদ/রকেট অ্যাপে গিয়ে পাঠান।</div>${Object.keys(n).map(k=>`<div class="num"><span>${k}</span><b>${n[k]||'—'}</b><button class="g" onclick="cp('${n[k]}')">কপি</button></div>`).join('')}</div>
<div class="card"><h2>পাঠানোর পর এখানে জানান</h2><label>কোন মাসের জন্য</label><select id="mo">${mo(4)}</select><label>কত টাকা পাঠিয়েছেন</label><input id="a" type="number" value="${me.fee}"><label>কোন মাধ্যমে</label><select id="me">${Object.keys(n).map(k=>`<option>${k}</option>`).join('')}</select><label>যে নাম্বার থেকে পাঠিয়েছেন</label><input id="fr" type="tel" placeholder="01XXXXXXXXX"><button class="w" onclick="sub()">রিকুয়েস্ট পাঠান</button></div>`}
async function sub(){const a=+v('a'),f=v('fr');if(!a||f.length<11)return toast('টাকা ও নাম্বার ঠিকভাবে দিন');
try{await DB.collection('requests').add({uid:me.id,month:+v('mo'),amount:a,via:v('me'),from:f,date:TODAY,status:'pending'});toast('রিকুয়েস্ট গেছে, অ্যাডমিন যাচাই করবেন');tab=0;draw()}catch(e){toast('পাঠানো যায়নি')}}

async function reqs(){const[R,M]=await Promise.all([get(DB.collection('requests').where('status','==','pending')),mems()]);
return `<div class="card"><h2>অপেক্ষমাণ রিকুয়েস্ট (${d(R.length)})</h2>${R.length?R.map(r=>{RQ[r.id]=r;const m=M.find(x=>x.id==r.uid)||{name:'?',fee:0};return `<div style="padding:10px 0;border-bottom:1px solid var(--bd)"><b>${m.name}</b><div class="mu">${ml(r.month)} এর জন্য · ${r.via} · ${r.from} · নির্ধারিত ${bn(m.fee)}</div><div class="num"><span>টাকা:</span><input id="e${r.id}" type="number" value="${r.amount}"></div>${r.amount!=m.fee?'<div class="mu" style="color:var(--am)">⚠ নির্ধারিত অঙ্কের সাথে মিল নেই, ঠিক করে নিন</div>':''}<div style="display:flex;gap:8px;margin-top:6px"><button style="flex:1" onclick="ok('${r.id}')">অ্যাকসেপ্ট</button><button class="r" onclick="no('${r.id}')">বাতিল</button></div></div>`}).join(''):'<div class="mu">কোনো নতুন রিকুয়েস্ট নেই</div>'}</div>`}
async function addPay(uid,month,amount,date,via,reqId){const b=DB.batch();b.set(DB.collection('payments').doc(),{uid,month,amount,date,via,by:me.id});b.update(DB.doc('summary/fund'),{income:FV.increment(amount)});if(reqId)b.update(DB.doc('requests/'+reqId),{status:'accepted',amount});await b.commit()}
async function ok(id){const r=RQ[id],a=+v('e'+id);if(!a)return toast('টাকার অঙ্ক দিন');try{await addPay(r.uid,r.month,a,TODAY,r.via,id);toast('ফান্ডে যুক্ত হয়েছে ✓');draw()}catch(e){toast('হয়নি: '+e.code)}}
async function no(id){await DB.doc('requests/'+id).update({status:'rejected'});draw()}

async function cash(){const M=await mems();return `<div class="card"><h2>হাতে পাওয়া টাকা যোগ করুন</h2><label>সদস্য</label><select id="cm" onchange="$('ca').value=this.selectedOptions[0].dataset.f">${M.map(m=>`<option value="${m.id}" data-f="${m.fee}">${m.name}</option>`).join('')}</select><label>কোন মাসের জন্য</label><select id="cmo">${mo(8)}</select><label>টাকা</label><input id="ca" type="number" value="${M[0]?M[0].fee:''}"><label>তারিখ</label><input id="cd" type="date" value="${TODAY}"><button class="w" onclick="addc()">জমা যোগ করুন</button></div>`}
async function addc(){const a=+v('ca'),dt=v('cd');if(!a||!dt)return toast('সব ঘর পূরণ করুন');try{await addPay(v('cm'),+v('cmo'),a,dt,'হাতে নগদ');toast('জমা যোগ হয়েছে ✓');draw()}catch(e){toast('হয়নি: '+e.code)}}

async function admMem(){if(viewM)return det();return await list()+`<div class="card"><h2>নতুন সদস্য যোগ করুন</h2><label>নাম</label><input id="nn"><label>ফোন নাম্বার</label><input id="np" type="tel"><label>প্রাথমিক পিন (কমপক্ষে ৬ সংখ্যা)</label><input id="nk" type="text"><label>ভূমিকা</label><select id="nr" onchange="$('nf').value=this.value=='general'?70:120"><option value="general">সাধারণ সদস্য</option><option value="senior">কমিটি</option></select><label>মাসিক জমা (টাকা)</label><input id="nf" type="number" value="70"><label>কোন মাস থেকে</label><select id="nj">${mo(24)}</select><button class="w" onclick="addm()">সদস্য যোগ করুন</button></div>`}
async function addm(){const n=v('nn'),p=v('np'),k=v('nk');if(!n||p.length<11||k.length<6)return toast('নাম, নাম্বার ও ৬+ সংখ্যার পিন দিন');
const sec=firebase.apps.find(a=>a.name=='sec')||firebase.initializeApp(CFG,'sec');
try{const c=await sec.auth().createUserWithEmailAndPassword(em(p),k);await sec.auth().signOut();await DB.doc('members/'+c.user.uid).set({name:n,phone:p,role:v('nr'),fee:+v('nf'),js:+v('nj')});toast('সদস্য যোগ হয়েছে ✓');draw()}catch(e){toast(e.code=='auth/email-already-in-use'?'এই নাম্বার আগেই আছে':'হয়নি: '+e.code)}}

async function admExp(){return await expCard()+`<div class="card"><h2>নতুন খরচ যোগ করুন</h2><label>কী কাজে</label><input id="xt"><label>কত টাকা</label><input id="xa" type="number"><label>তারিখ</label><input id="xd" type="date" value="${TODAY}"><button class="w" onclick="addx()">যোগ করুন</button></div>`}
async function addx(){const t=v('xt'),a=+v('xa');if(!t||!a)return toast('সব ঘর পূরণ করুন');const b=DB.batch();b.set(DB.collection('expenses').doc(),{title:t,amount:a,date:v('xd')});b.update(DB.doc('summary/fund'),{expense:FV.increment(a)});try{await b.commit();toast('খরচ যোগ হয়েছে');draw()}catch(e){toast('হয়নি')}}

async function sett(){const sw=(k,l)=>`<div class="sw"><span>${l}</span><button class="${S.perms[k]?'':'g'}" onclick="perm('${k}')">${S.perms[k]?'চালু':'বন্ধ'}</button></div>`;
return `<div class="card"><h2>সাধারণ সদস্য কী দেখতে পারবে</h2><div class="mu">নিজের তথ্য ও হিস্ট্রি সবসময় দেখতে পাবে।</div>${sw('fund','মোট ফান্ড')}${sw('exp','খরচের হিসাব')}</div><div class="card"><h2>আমার পেমেন্ট নাম্বার</h2>${Object.keys(S.numbers).map(k=>`<label>${k}</label><input value="${S.numbers[k]}" onchange="num('${k}',this.value)">`).join('')}</div>`}
async function perm(k){S.perms[k]=!S.perms[k];await DB.doc('settings/app').update({['perms.'+k]:S.perms[k]});draw()}
async function num(k,x){S.numbers[k]=x;await DB.doc('settings/app').update({['numbers.'+k]:x});toast('সেভ হয়েছে')}

async function draw(){if(!me)return;const r=me.role;let L,F;
if(r=='admin'){L=['রিকুয়েস্ট','সদস্য','হাতে জমা','খরচ','সেটিং'];F=[async()=>await reqs()+await fundCard(),admMem,cash,admExp,sett]}
else if(r=='senior'){L=['হোম','সদস্য','আমার হিস্ট্রি','টাকা পাঠান'];F=[async()=>await mine()+await fundCard()+await expCard(),async()=>viewM?det():list(),myHist,send]}
else{L=['হোম','আমার হিস্ট্রি','টাকা পাঠান'];F=[async()=>await mine()+(S.perms.fund?await fundCard():'')+(S.perms.exp?await expCard():''),myHist,send]}
$('nav').style.display='flex';$('nav').innerHTML=L.map((x,i)=>`<button class="${i==tab?'on':''}" onclick="T(${i})">${x}</button>`).join('');
$('app').innerHTML='<div class="mu" style="padding:20px;text-align:center">লোড হচ্ছে…</div>';
try{$('app').innerHTML=await F[tab]()+`<p style="text-align:center"><button class="g" onclick="A.signOut()">লগআউট (${me.name})</button></p>`}catch(e){$('app').innerHTML='<div class="card">তথ্য আনা যায়নি। ইন্টারনেট ও নিরাপত্তা নিয়ম (rules) ঠিক আছে কিনা দেখুন।<br><span class="mu">'+(e.code||e.message)+'</span></div>'}}

function loginUI(){$('nav').style.display='none';$('app').innerHTML=`<div class="card"><h2>লগইন</h2><label>ফোন নাম্বার</label><input id="lp" type="tel" placeholder="01XXXXXXXXX"><label>পিন</label><input id="lk" type="password" inputmode="numeric"><button class="w" onclick="login()">প্রবেশ করুন</button></div><p style="text-align:center"><button class="g" onclick="setupUI()">প্রথমবার? অ্যাডমিন সেটআপ</button></p>`}
const login=()=>A.signInWithEmailAndPassword(em(v('lp')),v('lk')).catch(()=>toast('নাম্বার বা পিন ভুল'));
function setupUI(){$('app').innerHTML=`<div class="card"><h2>প্রথম অ্যাডমিন তৈরি</h2><div class="mu">এটি শুধু একবারই কাজ করবে, সংগঠনের অ্যাডমিন হিসেবে।</div><label>আপনার নাম</label><input id="n"><label>ফোন নাম্বার</label><input id="p" type="tel"><label>পিন (কমপক্ষে ৬ সংখ্যা)</label><input id="k" type="password"><button class="w" onclick="setup()">অ্যাডমিন তৈরি করুন</button></div><p style="text-align:center"><button class="g" onclick="loginUI()">← লগইনে ফিরুন</button></p>`}
async function setup(){if(!v('n')||v('p').length<11||v('k').length<6)return toast('সব ঘর ঠিকভাবে পূরণ করুন');booting=true;
try{const c=await A.createUserWithEmailAndPassword(em(v('p')),v('k'));
await DB.doc('members/'+c.user.uid).set({name:v('n'),phone:v('p'),role:'admin',fee:120,js:CUR});
await DB.doc('settings/app').set({numbers:{'বিকাশ':'','নগদ':'','রকেট':''},perms:{fund:true,exp:true}});
await DB.doc('summary/fund').set({income:0,expense:0});booting=false;load(c.user)}catch(e){booting=false;toast('সেটআপ হয়নি: '+e.code)}}
async function load(u){try{const s=await DB.doc('members/'+u.uid).get();if(!s.exists){$('nav').style.display='none';$('app').innerHTML='<div class="card">আপনার অ্যাকাউন্ট এখনো সদস্য তালিকায় যুক্ত হয়নি। অ্যাডমিনকে জানান।</div><p style="text-align:center"><button class="g" onclick="A.signOut()">লগআউট</button></p>';return}
me={id:u.uid,...s.data()};const t=await DB.doc('settings/app').get();if(t.exists)S={numbers:{},perms:{},...t.data()};tab=0;viewM=null;draw()}catch(e){toast('লোড হয়নি: '+e.code)}}
A.onAuthStateChanged(u=>{if(booting)return;if(!u){me=null;loginUI()}else load(u)});
</script></body></html>
